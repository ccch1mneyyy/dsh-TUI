<svg xmlns="http://www.w3.org/2000/svg" width="600" height="920" viewBox="0 0 600 920" role="img" aria-labelledby="title desc">
  <title id="title">dsh-TUI live runtime preview</title>
  <desc id="desc">An animated reconstruction of the real terminal hierarchy: logo header, transcript, thinking preview, tool card, composer and status line.</desc>
  <style>
    text { font-family: "Cascadia Code","SFMono-Regular",Consolas,"Liberation Mono","Microsoft YaHei",monospace; letter-spacing: 0; }
    a:hover .tile { fill: #1b2028; }
    a:focus-visible .tile { stroke: #8bb6fb; stroke-width: 3; }
    .spinner-a { animation: spinnerA 1s steps(1,end) infinite; }
    .spinner-b { animation: spinnerB 1s steps(1,end) infinite; }
    .thinking-row { animation: thinkingRow 16s step-end infinite; }
    .tool-row { animation: toolRow 16s step-end infinite; }
    .tool-running { animation: toolRunning 16s step-end infinite; }
    .tool-done { animation: toolDone 16s step-end infinite; }
    .answer { animation: answer 16s step-end infinite; }
    .answer-mask { transform-origin:0 0; animation: answerReveal 16s steps(31,end) infinite; }
    .answer-two { animation: answerTwo 16s step-end infinite; }
    .draft { animation: draft 16s step-end infinite; }
    .draft-mask { transform-origin:0 0; animation: draftReveal 16s steps(44,end) infinite; }
    .draft-caret { animation: draftCaret 16s steps(44,end) infinite, blink 1s step-end infinite; }
    .empty-caret { animation: emptyCaret 16s step-end infinite, blink 1s step-end infinite; }
    .pending { animation: pending 16s step-end infinite; }
    .busy-status { animation: busyStatus 16s step-end infinite; }
    .idle-status { animation: idleStatus 16s step-end infinite; }
    .activity { transform-origin:0 0; animation: activity 16s linear infinite; }
    .live-dot { animation: pulse 1.4s ease-in-out infinite; }
    @keyframes spinnerA { 0%,49% { opacity:1 } 50%,100% { opacity:0 } }
    @keyframes spinnerB { 0%,49% { opacity:0 } 50%,100% { opacity:1 } }
    @keyframes blink { 0%,48% { opacity:1 } 49%,100% { opacity:0 } }
    @keyframes pulse { 0%,100% { opacity:.35 } 50% { opacity:1 } }
    @keyframes thinkingRow { 0%,33% { opacity:1 } 34%,100% { opacity:.38 } }
    @keyframes toolRow { 0%,20% { opacity:0 } 22%,100% { opacity:1 } }
    @keyframes toolRunning { 0%,20% { opacity:0 } 22%,46% { opacity:1 } 47%,100% { opacity:0 } }
    @keyframes toolDone { 0%,46% { opacity:0 } 47%,100% { opacity:1 } }
    @keyframes answer { 0%,48% { opacity:0 } 50%,100% { opacity:1 } }
    @keyframes answerReveal { 0%,49% { transform:scaleX(0) } 74%,100% { transform:scaleX(1) } }
    @keyframes answerTwo { 0%,73% { opacity:0 } 75%,100% { opacity:1 } }
    @keyframes draft { 0%,70% { opacity:0 } 72%,100% { opacity:1 } }
    @keyframes draftReveal { 0%,71% { transform:scaleX(0) } 91%,100% { transform:scaleX(1) } }
    @keyframes draftCaret { 0%,71% { transform:translateX(0) } 91%,100% { transform:translateX(366px) } }
    @keyframes emptyCaret { 0%,71% { opacity:1 } 72%,100% { opacity:0 } }
    @keyframes pending { 0%,91% { opacity:0 } 92%,100% { opacity:1 } }
    @keyframes busyStatus { 0%,91% { opacity:1 } 92%,100% { opacity:0 } }
    @keyframes idleStatus { 0%,91% { opacity:0 } 92%,100% { opacity:1 } }
    @keyframes activity { 0% { transform:scaleX(.07) } 92%,100% { transform:scaleX(1) } }
  </style>
  <defs>
      <clipPath id="answer-clip"><rect class="answer-mask" x="0" y="-25" width="498" height="64"/></clipPath>
      <clipPath id="draft-clip"><rect class="draft-mask" x="0" y="-25" width="366" height="34"/></clipPath>
    </defs>
    <rect x="1" y="1" width="598" height="918" rx="6" fill="#f7f8fa" stroke="#c8d0dc" stroke-width="2"/>
    <rect x="1" y="1" width="598" height="42" rx="6" fill="#edf1f6"/>
    <path d="M1 42H599" stroke="#c8d0dc"/>
    <g transform="translate(24 11) scale(0.7916666666666666)" fill="none" stroke="#416fcb" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19h8"/><path d="m4 17 6-6-6-6"/></g>
    <text x="53" y="28" font-size="16" fill="#303743" font-weight="700">dsh-TUI</text>
    <circle class="live-dot" cx="498" cy="21" r="4" fill="#2f9c83"/>
    <text x="576" y="27" font-size="13" fill="#2f806f" text-anchor="end" font-weight="700">LIVE RUNTIME</text>

    <text x="24" y="60" font-size="16" fill="#48515f" >✦ dsh-TUI  v0.10.2</text>
    <text x="24" y="106" font-size="34" fill="#416fcb" font-weight="700">DEEPSEEK</text>
    <text x="24" y="148" font-size="34" fill="#7b9fd8" font-weight="700">HARNESS</text>
    <text x="24" y="179" font-size="15" fill="#4b5563" >deepseek-v4-flash · Max effort</text>
    <text x="24" y="205" font-size="14" fill="#7a8492" >~/projects/dsh-TUI-693</text>
    <text x="24" y="231" font-size="13" fill="#7a8492" >Tip: Ctrl+O expands details · /tips for more</text>
    <text x="24" y="266" font-size="17" fill="#416fcb" font-weight="700">Explore the uncharted!</text>
    <path d="M24 270H576" stroke="#d7dde6"/>
    <rect x="24" y="288" width="552" height="40" fill="#eee6cf"/>
    <text x="34" y="315" font-size="24" fill="#416fcb" font-weight="700">›</text>
    <text x="58" y="314" font-size="17" fill="#303743" font-weight="600">hi</text>
    <g class="thinking-row">
      <g class="spinner-a"><text x="24" y="362" font-size="23" fill="#6787bd" >∷</text></g>
      <g class="spinner-b"><text x="24" y="362" font-size="23" fill="#6787bd" >⋮</text></g>
      <text x="50" y="360" font-size="17" fill="#667085" font-style="italic">Thinking · 5s  (ctrl+o to expand)</text>
      <text x="50" y="389" font-size="15" fill="#87919f" >Reading the workspace and current session.</text>
      <text x="50" y="413" font-size="15" fill="#87919f" >Preparing a concise welcome and useful next steps.</text>

    </g>
    <g class="tool-row">
      <rect x="24" y="456" width="552" height="82" fill="#eef2f7"/>
      <g class="tool-running"><circle cx="34" cy="481" r="5" fill="#d39b32"/><text x="50" y="487" font-size="17" fill="#416fcb" font-weight="700">Read  AGENTS.md</text><text x="50" y="517" font-size="15" fill="#7a8492" >└ Loading project guidance…</text></g>
      <g class="tool-done"><circle cx="34" cy="481" r="5" fill="#2f9c83"/><text x="50" y="487" font-size="17" fill="#416fcb" font-weight="700">Read  AGENTS.md · 0.6s</text><text x="50" y="517" font-size="15" fill="#7a8492" >└ Project guidance loaded</text></g>
    </g>
    <g class="answer">
      <circle cx="31" cy="584" r="5" fill="#303743"/>
      <g transform="translate(48 590)" clip-path="url(#answer-clip)"><text x="0" y="0" font-size="17" fill="#303743" font-weight="600">Hi! I am your terminal coding partner.</text></g>
      <g class="answer-two"><text x="48" y="622" font-size="17" fill="#303743" >I can write code, fix bugs, research, or improve docs.</text><text x="48" y="653" font-size="14" fill="#5d6674" >Tell me what you want to build.</text></g>
    </g>
    <path d="M24 826H576" stroke="#7fa2d8" stroke-width="2"/>
    <path d="M24 898H576" stroke="#7fa2d8" stroke-width="2"/>
    <text x="26" y="869" font-size="25" fill="#303743" font-weight="700">›</text>
    <rect class="empty-caret" x="54" y="846" width="10" height="29" fill="#303743"/>
    <g class="draft" transform="translate(55 869)"><g clip-path="url(#draft-clip)"><text x="0" y="0" font-size="17" fill="#303743" >Show me where to start in this project</text></g><rect class="draft-caret" x="2" y="-23" width="9" height="28" fill="#416fcb"/></g>
    <g class="pending"><text x="26" y="812" font-size="14" fill="#2f806f" >⚡ Steer · delivered next</text><text x="576" y="812" font-size="13" fill="#7a8492" text-anchor="end">Esc interrupts and sends immediately</text></g>
    <g class="busy-status"><text x="24" y="751" font-size="14" fill="#416fcb" font-weight="700">spat</text><text x="576" y="751" font-size="14" fill="#5d6674" text-anchor="end">ctx 6.9% · 22 tps</text></g>
    <g class="idle-status"><text x="24" y="751" font-size="14" fill="#416fcb" font-weight="700">spat</text><text x="576" y="751" font-size="14" fill="#5d6674" text-anchor="end">ctx 7.2% · 0 tps</text></g>
    <rect x="24" y="765" width="552" height="4" fill="#dce2ea"/><g transform="translate(24 765)"><rect class="activity" width="68" height="4" fill="#416fcb"/></g>
    <text x="24" y="795" font-size="13" fill="#5d6674" >deepseek-v4-flash · max</text>
    <text x="576" y="795" font-size="13" fill="#416fcb" text-anchor="end">main · ?</text>
</svg>
