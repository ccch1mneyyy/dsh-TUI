<svg xmlns="http://www.w3.org/2000/svg" width="480" height="96" viewBox="0 0 480 96" role="img" aria-labelledby="title desc">
  <title id="title">Themes</title>
  <desc id="desc">Built-in and custom palettes</desc>
  <style>
    text { font-family: "Cascadia Code","SFMono-Regular",Consolas,"Liberation Mono","Microsoft YaHei",monospace; letter-spacing: 0; }
    a:hover .tile { fill: #1b2028; }
    a:focus-visible .tile { stroke: #8bb6fb; stroke-width: 3; }
    
    text { fill: #ffffff; stroke: #111519; stroke-width: 1.5; paint-order: stroke fill; stroke-linejoin: round; }
    @media (prefers-color-scheme: light) {
      .tile { fill: #f5f7fa; stroke: #65717f; }
      a:hover .tile { fill: #e8edf4; }
    }

  </style>
  
