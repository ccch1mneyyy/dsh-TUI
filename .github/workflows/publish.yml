name: Publish

# 发版入口：推送 v* 标签（git tag v0.4.2 && git push origin v0.4.2）。
# 首次发布继续使用仓库 Secrets 中的 NPM_TOKEN 鉴权；标签版本号必须与
# package.json 的 version 一致。OIDC 仅用于生成 npm provenance。
# After npm publish, the release job creates the GitHub Release with
# generated notes. Backfill an existing tag without publishing:
# Actions → Publish → Run workflow → tag.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to create/update the GitHub Release for (skips npm publish)'
        required: true
        type: string

permissions:
  contents: read

# One run per tag at a time (tag push vs. manual backfill).
concurrency:
  group: publish-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  npm:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      # Gate scripts assert zh UI copy (same convention as CI).
      DSH_TUI_LANG: zh
    steps:
      - uses: actions/checkout@v7
        with:
          # vendor/dsh-std 是 @dsh-std/* workspace 依赖的来源（#308）：
          # 不拉子模块时 prepare→compile 在空目录上构建出悬空链接，
          # tsc 全线 TS2307。
          submodules: recursive

      # 版本来自 package.json 的 packageManager 字段，不在此内联 pin。
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - run: pnpm install --frozen-lockfile

      - run: pnpm compile

      - name: Verify clean compile output
        run: |
          test -f lib/types/index.js
          test -f lib/types/dsh-adapter/invariant.js

      - run: pnpm verify:build

      - run: pnpm verify:package
      - run: pnpm verify:bun-package

      # 标签与 package.json version 不一致直接失败，防止发错版本。
      - name: Check tag matches package version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          [ "$tag" = "$pkg" ] || { echo "tag $tag != package.json $pkg"; exit 1; }

      - run: node --import tsx/esm scripts/repro-askpanel.tsx

      # 问卷回退回归：答案按题覆盖、草稿恢复、Esc 分层语义与最终摘要。
      - run: node --import tsx/esm scripts/verify-question-backtrack.tsx

      - run: node --import tsx/esm scripts/repro-toolcards.tsx

      # /provider 向导与面板 hideCustomInput 回归（发版门禁同 CI）。
      - run: node scripts/verify-provider-wizard.mjs
      - run: node --import tsx/esm scripts/verify-askpanel-hide-custom-input.tsx

      # 用 npm 而非 pnpm 发布：@dsh-std/* 是 bundledDependencies（workspace
      # 包，#308），pnpm 在 isolated linker 下拒绝。发布包装器只在 npm
      # pack/publish 期间把 7 个 bundled 包改成精确版本的 optionalDependencies，
      # 让 Bun 不再解析 workspace:*；退出后恢复源码 manifest。
      # 本地已先发布过同一版本（tag 补推）时跳过，避免 E403 红 run。
      - name: Skip when already published
        id: published
        run: |
          if output="$(npm view "@deepseek-harness-tui/dsh-tui@${GITHUB_REF_NAME}" version 2>&1)"; then
            echo "$output"
            echo "version ${GITHUB_REF_NAME} already published — skipping"
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            status=$?
            echo "$output"
            case "$output" in
              *E404*|*404\ Not\ Found*)
                echo "version ${GITHUB_REF_NAME} not published yet — continuing"
                echo "exists=false" >> "$GITHUB_OUTPUT"
                ;;
              *)
                echo "npm registry query failed (exit $status); refusing to assume unpublished"
                exit "$status"
                ;;
            esac
          fi
      # npm ≥11 拒绝为 prerelease 版本隐式发布（"You must specify a tag
      # using --tag when publishing a prerelease version"）。本仓库的发版
      # 策略是 prerelease 也占 latest（用户决策：beta 立刻推给 /update
      # 用户），因此对 prerelease 显式传 `--tag latest`；稳定版保持默认。
      - name: Compute npm dist-tag flag for prerelease versions
        id: disttag
        run: |
          pkg="$(node -p "require('./package.json').version")"
          case "$pkg" in
            *-*) echo "flag=--tag latest" >> "$GITHUB_OUTPUT"
                 echo "publishing prerelease $pkg with an explicit latest tag" ;;
            *)   echo "flag=" >> "$GITHUB_OUTPUT"
                 echo "publishing stable $pkg with the default latest tag" ;;
          esac
      - run: node scripts/with-publish-manifest.mjs npm publish --access public --provenance $DISTTAG_FLAG
        if: steps.published.outputs.exists != 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          DISTTAG_FLAG: ${{ steps.disttag.outputs.flag }}

  # Create or update the GitHub Release with generated notes (What's Changed,
  # New Contributors, Full Changelog; .github/release.yml excludes bots).
  # Optional hand-written summary: .github/release-notes/<tag>.md at the tag.
  # Generated notes follow a marker comment so reruns and backfills stay idempotent.
  release:
    needs: npm
    if: ${{ !cancelled() && (needs.npm.result == 'success' || (github.event_name == 'workflow_dispatch' && needs.npm.result == 'skipped')) }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      missing-assets: ${{ steps.assets.outputs.missing }}
    steps:
      - name: Resolve tag
        id: tag
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          tag="${INPUT_TAG:-$GITHUB_REF_NAME}"
          case "$tag" in
            v[0-9]*) ;;
            *) echo "not a release tag: $tag"; exit 1 ;;
          esac
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      # Checking out the tag also fails fast when a dispatched tag does not exist.
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ steps.tag.outputs.tag }}

      - name: Create or update GitHub Release
        id: notes
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          marker='<!-- dsh-tui:generated-notes -->'
          summary=".github/release-notes/$TAG.md"
          err="$RUNNER_TEMP/view.err"
          generated="$RUNNER_TEMP/generated.md"
          notes="$RUNNER_TEMP/notes.md"

          if body="$(gh release view "$TAG" --json body --jq .body 2>"$err")"; then
            exists=true
          elif grep -q 'release not found' "$err"; then
            exists=false
            body=''
          else
            cat "$err"
            exit 1
          fi

          # Done before: our marker, or a What's Changed list from a manual
          # `--generate-notes` (a bare Full Changelog link does not count).
          if [ "$exists" = true ] && {
            printf '%s\n' "$body" | grep -qF "$marker" ||
            printf '%s\n' "$body" | grep -qE "^## What's Changed"
          }; then
            echo "Release $TAG already has generated notes; leaving the body untouched"
            exit 0
          fi

          # Same Release Notes API that `gh release create --generate-notes` uses.
          { echo "$marker"; gh api "repos/$GH_REPO/releases/generate-notes" -f tag_name="$TAG" --jq .body; } > "$generated"
          if [ -n "$(printf '%s' "$body" | tr -d '[:space:]')" ]; then
            # Keep the maintainer's hand-written body; append below it.
            { printf '%s\n\n' "$body"; cat "$generated"; } > "$notes"
          elif [ -f "$summary" ]; then
            { cat "$summary"; printf '\n\n'; cat "$generated"; } > "$notes"
          else
            cp "$generated" "$notes"
          fi

          if [ "$exists" = true ]; then
            gh release edit "$TAG" --notes-file "$notes"
            echo "updated Release $TAG notes"
          else
            gh release create "$TAG" --verify-tag --title "$TAG" --notes-file "$notes"
            echo "created Release $TAG"
          fi

      # Tag pushes (including "Re-run all jobs") rebuild bundles whenever the
      # Release lacks any asset listed in its SHA256SUMS. Backfills only touch notes.
      - name: Check release assets
        id: assets
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          sums="$RUNNER_TEMP/SHA256SUMS"
          # Only finished, non-empty uploads count: a failed upload (e.g. a
          # 502) can leave a same-named asset in state "starter" with size 0.
          have="$(gh release view "$TAG" --json assets --jq '.assets[] | select(.state == "uploaded" and .size > 0) | .name')"
          if ! grep -qxF SHA256SUMS <<<"$have" \
            || ! gh release download "$TAG" --pattern SHA256SUMS --output "$sums" --clobber \
            || [ ! -s "$sums" ]; then
            echo "SHA256SUMS not uploaded on Release $TAG; bundles needed"
            echo "missing=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          missing=false
          while read -r _ name; do
            [ -n "$name" ] || continue
            if ! grep -qxF "$name" <<<"$have"; then
              echo "missing asset: $name"
              missing=true
            fi
          done < "$sums"
          echo "missing=$missing" >> "$GITHUB_OUTPUT"

  # A Release created with github.token does not fire `release: published`,
  # so bundles are built here. release-bundle.yml serializes uploads per tag,
  # so a maintainer's release:published run and this call do not overlap.
  bundle:
    needs: release
    if: needs.release.outputs.missing-assets == 'true'
    permissions:
      contents: write
    uses: ./.github/workflows/release-bundle.yml
    with:
      tag: ${{ needs.release.outputs.tag }}
