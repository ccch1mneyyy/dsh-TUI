name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      # 带断言的回归：提问面板内联输入（issue #9）+ 工具卡排版
      # （⎿ 缩进、diff 红绿行、信封剥离），失败即非零退出。
      - run: node --import tsx/esm scripts/repro-askpanel.tsx

      # 提问面板全应用布局回归：短/长高录、activity tick 差分、resize 风暴。
      - run: node --import tsx/esm scripts/verify-askpanel-layout.tsx

      - run: node --import tsx/esm scripts/repro-toolcards.tsx

      # 退出漏斗回归（issue #12）：上下文 teardown 不得走到进程退出。
      - run: node --import tsx/esm scripts/verify-teardown-exit.tsx

      # /update 纯函数回归：版本探测（双布局+外来 manifest 拒绝）、
      # registry 解析（env/npmrc/默认）、semver 比较、pnpm --latest。
      - run: node scripts/verify-update.mjs

      # resume 兼容层回归：多帧 zstd 会话日志里的第三方事件类型补
      # ignorable 标记，已知类型不动，二次运行幂等。
      - run: node scripts/verify-resume-repair.mjs

      # channel 层回归：发送链（submit/steer/撤回/打断重投）、compact 折叠、
      # goal/todo 事件回放。曾因不在 CI 而随接口演进静默失效（0.3.6 的
      # installModelSelection、#34 的投递异步化都没被它们拦下），挂进来
      # 防再腐烂。
      - run: node --import tsx/esm scripts/verify-submit.mjs

      - run: node --import tsx/esm scripts/verify-compact.mjs

      - run: node --import tsx/esm scripts/verify-channel-goal-todo.mjs

      # effort 配置链路回归（issue #51）：cordis 配置的 effort 必须进入实际
      # 请求配置，而不是只做状态栏启动显示（≤0.3.5 的 display-only 行为）。
      - run: node --import tsx/esm scripts/repro-effort.tsx

      # 子进程 stderr 接管回归（issue #17）：inherit 的 MCP 子进程 stderr
      # 不再裸写终端破坏 alt-screen，输出去重聚合为受控通知。
      - run: node --import tsx/esm scripts/verify-child-stderr.tsx

      # 模型路由原子解析回归（issue #67）：完整 config > pref > default 整对
      # 生效，provider-only pin 不得与另一半拼接出错配路由。
      - run: node scripts/verify-model-route.mjs

      # CJK 显示宽度截断回归（issue #41）：4 处描述按终端显示宽度处理，
      # CJK 不劈字、窄终端布局不破。
      - run: node --import tsx/esm scripts/verify-cjk-truncate.tsx
