name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      # 带断言的回归：提问面板内联输入（issue #9）+ 工具卡排版
      # （⎿ 缩进、diff 红绿行、信封剥离），失败即非零退出。
      - run: node --import tsx/esm scripts/repro-askpanel.tsx

      # 提问面板全应用布局回归：短/长高录、activity tick 差分、resize 风暴。
      - run: node --import tsx/esm scripts/verify-askpanel-layout.tsx

      - run: node --import tsx/esm scripts/repro-toolcards.tsx

      # 滚动/pill/内联模式回归：新消息 pill 计数递减、Ctrl+C 交互、
      # 内联 scrollback 第三方终端适配。曾因 mock channel 缺新字段而
      # 静默冻结（render 期 TypeError 被 ink 吞掉），不在 CI 里烂了
      # 整个 0.6.x 才被发现——挂进来防再烂。
      - run: node --import tsx/esm scripts/repro-pill.tsx
      - run: node --import tsx/esm scripts/repro-ctrlc.tsx
      - run: node --import tsx/esm scripts/repro-inline-scrollback.tsx
      - run: node --import tsx/esm scripts/repro-inline-thirdparty.tsx

      # 按键解析回归（issue #110）：Option+Enter（ESC CR）精确/合并/分块
      # 三种到达形态、CSI-u 与 modifyOtherKeys 的 Shift/Ctrl/Meta+Enter。
      - run: node --import tsx/esm scripts/verify-keys.tsx

      # 终端能力探测回归：延迟 OSC/XTVERSION 回复期间保持 raw mode，
      # 回复只进 querier，不回显成终端残影。
      - run: node --import tsx/esm scripts/verify-terminal-queries.tsx

      # 退出漏斗回归（issue #12）：上下文 teardown 不得走到进程退出。
      - run: node --import tsx/esm scripts/verify-teardown-exit.tsx

      # 退出 resume marker 回归（issue #42）：仅有实际消息或 pending 操作时保留 marker。
      - run: node --import tsx/esm scripts/verify-exit-resume-marker.tsx

      # 退出阶段 stderr/console 恢复回归（issue #42）：shutdown 解绑恢复物理流并注销监听器。
      - run: node --import tsx/esm scripts/verify-shutdown-stderr.tsx

      # /update 纯函数回归：版本探测（双布局+外来 manifest 拒绝）、
      # registry 解析（env/npmrc/默认）、semver 比较、pnpm --latest。
      - run: node scripts/verify-update.mjs

      # 直达启动器回归（issue #108）：参数透传、残骸 profile 重装、
      # 版本不一致提示、双语消息、shellQuote 转义规则。
      - run: node scripts/verify-launcher.mjs

      # 换名迁移回归（issue #120）：~/.dsh-cc → ~/.dsh-tui 首启复制迁移、
      # resume.txt 双写契约、旧 env 名检测（DSH_CC_RESUME_SESSION 双读不算废弃）。
      - run: node scripts/verify-legacy-rename.mjs

      # 审批服务配置回归（issue #49 尾巴）：裸组合 cordis.yml 必须挂载
      # approval 行；裸组合与 profile patch 的 policy 表达式逐场景同值
      #（ask / never / win32 never），两个入口语义不漂移。
      - run: node scripts/verify-cordis-approval.mjs

      # resume 兼容层回归：多帧 zstd 会话日志里的第三方事件类型补
      # ignorable 标记，已知类型不动，二次运行幂等。
      - run: node scripts/verify-resume-repair.mjs

      # 选择器修复回归：/resume 打开时对列出的冷会话先执行 compat 修复，
      # 再读取标题——共享根目录下 web/history 读取者随后即可加载。
      - run: node scripts/verify-picker-repair.mjs

      # 会话标题回归：选择器标题宽容读取（带未标记第三方事件的日志
      # 不能让标题退化成目录名），/rename 的最后一条 session/title 优先。
      - run: node scripts/verify-session-titles.mjs

      # 会话 cwd 回归（issue #96）：启动目录向上解析 git 仓库根（普通克隆
      # 与 .git 文件 worktree 均覆盖、dotfiles ~/.git 守卫），/resume 过滤
      # 双向兼容升级前记录的子目录会话，Windows 分隔符与大小写语义。
      - run: node scripts/verify-session-cwd.mjs

      # 模态确认 Enter 守卫回归（4-PR 评审尾巴）：Option+Enter（ESC CR）/
      # Ctrl+Enter（CSI 13;5u）不得触发审批面板决定或任何模态确认，
      # 仅无修饰 Enter 生效；ApprovalPanel 全链路 + 源码静态不变量。
      - run: node scripts/verify-plain-enter-guard.mjs
      # /resume 会话管理回归（issue #112）：picker 重命名追加帧（seq 连续、
      # 已有字节不动、last-title-wins）、删除目录、路径穿越 id 拒绝。
      - run: node scripts/verify-resume-manage.mjs

      # /resume 深度窗口外重命名回归（issue #112 review）：MRU 前 20 之外
      # 的会话改名后必须显示新标题（touch 进入标题窗口），不能回落到目录名。
      - run: node scripts/verify-resume-rename-mru.mjs

      # /resume picker 按键流回归（4-PR 评审尾巴）：rename 后焦点跟随目标行
      # 重锚（否则 Enter/ctrl+d 误伤邻行）、confirm-delete 只认无修饰
      # Enter、Esc 取消、删除后行消失。真实 Chat 渲染驱动。
      - run: node scripts/verify-resume-picker-ui.mjs

      # channel 层回归：发送链（submit/steer/撤回/打断重投）、compact 折叠、
      # goal/todo 事件回放。曾因不在 CI 而随接口演进静默失效（0.3.6 的
      # installModelSelection、#34 的投递异步化都没被它们拦下），挂进来
      # 防再腐烂。
      - run: node --import tsx/esm scripts/verify-submit.mjs

      - run: node --import tsx/esm scripts/verify-compact.mjs

      - run: node --import tsx/esm scripts/verify-channel-goal-todo.mjs

      # 技能斜杠命令补全回归（issue #86）：user-invocable 技能合并进 /
      # 菜单与 Tab 补全（skill 标记、与 locals/注册表撞名让位），
      # skills/change 实时增删，读取失败保留 last-good。
      - run: node scripts/verify-skill-commands.mjs

      # effort 配置链路回归（issue #51）：cordis 配置的 effort 必须进入实际
      # 请求配置，而不是只做状态栏启动显示（≤0.3.5 的 display-only 行为）。
      - run: node --import tsx/esm scripts/repro-effort.tsx

      # 子进程 stderr 接管回归（issue #17）：inherit 的 MCP 子进程 stderr
      # 不再裸写终端破坏 alt-screen，输出去重聚合为受控通知。
      - run: node --import tsx/esm scripts/verify-child-stderr.tsx

      # 模型路由原子解析回归（issue #67）：完整 config > pref > default 整对
      # 生效，provider-only pin 不得与另一半拼接出错配路由。
      - run: node scripts/verify-model-route.mjs

      # CJK 显示宽度截断回归（issue #41）：4 处描述按终端显示宽度处理，
      # CJK 不劈字、窄终端布局不破。
      - run: node --import tsx/esm scripts/verify-cjk-truncate.tsx

      # thinking spinner 残影回归（issue #72）：text-default emoji（✳）
      # 量宽 2 实画 1 致 spinner 行每帧错位，thinking 残影堆积不消失。
      - run: node --import tsx/esm scripts/repro-thinking.tsx

      # 斜杠命令描述 i18n 回归（issue #41）：/ 菜单与 ? 帮助菜单描述随
      # /lang 中英切换，外部命令查不到映射回退注册表原文，窄终端中文不劈字。
      - run: node --import tsx/esm scripts/verify-i18n-command-descriptions.tsx
      # /effort 滑杆 + 模式指示全应用回归（真实 Chat 渲染）：滑杆开/
      # ←/→ 实时生效/Esc 关闭、状态栏 effort 段与模式段、三次 backtab
      # 完整循环。
      - run: node scripts/verify-effort-slider-ui.mjs

      # /trace 轨迹视图回归（issue #80）：事件装配配对耗时 + 组件渲染/滚动。
      - run: node --import tsx/esm scripts/repro-trace.tsx
