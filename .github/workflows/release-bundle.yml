name: Build release bundles

# 发布新 Release 时自动构建"一键安装整合包"与各平台"便携包"并上传为该 Release 的资产：
#   - dsh-tui-setup.zip（一键安装脚本整合包）
#   - dsh-tui-setup-win-x64.exe（Windows 离线安装程序）
#   - dsh-tui-standalone-linux-x64.tar.gz（Linux x64 便携版）
#   - dsh-tui-standalone-linux-arm64.tar.gz（Linux arm64 便携版）
#   - dsh-tui-standalone-win-x64.zip（Windows x64 便携版）
#   - dsh-tui-standalone-darwin-arm64.tar.gz（macOS Apple Silicon 便携版）
#   - dsh-tui-standalone-darwin-x64.tar.gz（macOS Intel 便携版）
# 也可手动触发：Actions → Build release bundles → Run workflow → 填 tag。

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: '上传到哪个 tag（默认：最新 release）'
        required: false
        type: string
      kernel_version:
        description: '可选：固定 @deepseek-ai/dsh 的 RC 版本；留空自动选择最新的兼容 RC'
        required: false
        type: string
  # Called by publish.yml when the tag's Release lacks assets (a Release
  # created with github.token does not fire `release: published`).
  workflow_call:
    inputs:
      tag:
        description: 'Tag whose Release receives the bundles'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-bundle-${{ inputs.tag || github.event.release.tag_name || github.ref_name }}
  cancel-in-progress: false

jobs:
  bundle:
    needs: windows-installer
    runs-on: ubuntu-latest
    steps:
      # Build from the tag so bundles carry that tag's package.json version.
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.ref }}
          submodules: recursive

      # 版本来自 package.json 的 packageManager 字段，不在此内联 pin。
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Generate installer bundle
        run: node scripts/make-installer-bundle.mjs --out dist-bundle

      - name: Syntax check generated scripts
        run: |
          bash -n dist-bundle/dsh-tui-setup/install.sh
          pwsh -NoProfile -Command "[scriptblock]::Create((Get-Content -Raw -Encoding UTF8 'dist-bundle/dsh-tui-setup/install.ps1')) | Out-Null"

      # The standalone build installs this version from npm, and a fresh
      # publish can take several minutes to become resolvable.
      - name: Wait for the version on npm
        run: |
          version="$(node -p "require('./package.json').version")"
          for i in $(seq 1 30); do
            if npm view "@deepseek-harness-tui/dsh-tui@$version" version >/dev/null 2>&1; then
              echo "@deepseek-harness-tui/dsh-tui@$version is on npm"
              exit 0
            fi
            echo "waiting for @deepseek-harness-tui/dsh-tui@$version on npm ($i/30)"
            sleep 30
          done
          echo "@deepseek-harness-tui/dsh-tui@$version not on npm after 15 minutes"
          exit 1

      - name: Generate standalone portable bundles
        run: node scripts/make-standalone-bundle.mjs --out dist-standalone

      - name: Collect portable assets
        run: |
          mkdir dist-release
          cp dist-bundle/dsh-tui-setup.zip dist-standalone/* dist-release/

      - uses: actions/download-artifact@v4
        with:
          name: windows-release-assets
          path: dist-release

      # Collect both platforms here so one SHA256 manifest covers every asset.
      - name: Generate SHA256SUMS for all release assets
        working-directory: dist-release
        run: |
          sha256sum * > .SHA256SUMS.tmp
          mv .SHA256SUMS.tmp SHA256SUMS
          cat SHA256SUMS

      - uses: actions/upload-artifact@v4
        with:
          name: dsh-tui-bundles
          path: dist-release/*
          if-no-files-found: error

      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          # ${{ }} 表达式一律经 env 中转，绝不内插进 run 的 shell 文本：
          # workflow_dispatch 的 inputs.tag 是用户输入，直接内插等于把
          # `"$(curl …)"` 类 payload 拼进命令行（表达式注入）。
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          INPUT_TAG: ${{ inputs.tag }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          tag="$RELEASE_TAG"
          [ -z "$tag" ] && tag="$INPUT_TAG"
          if [ -z "$tag" ]; then
            tag="$(gh release list --limit 1 --json tagName -q '.[0].tagName')"
          fi
          if [ -z "$tag" ]; then
            # A manual build on a branch has no release to publish to; the
            # artifacts above are the deliverable, so this is not a failure.
            [ "$EVENT_NAME" = "workflow_dispatch" ] || { echo "no tag given"; exit 1; }
            echo "No release tag for this manual run; skipping the upload (artifacts are uploaded above)."
            exit 0
          fi
          echo "Uploading release artifacts -> $tag"
          gh release upload --clobber -- "$tag" dist-release/*

  windows-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.ref }}

      - uses: actions/setup-node@v7
        with:
          node-version: 24.16.0

      - name: Install installer build tools
        run: npm ci --prefix scripts/windows --ignore-scripts

      - name: Wait for the version on npm
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          for ($attempt = 1; $attempt -le 30; $attempt++) {
            npm view "@deepseek-harness-tui/dsh-tui@$version" version
            if ($LASTEXITCODE -eq 0) { exit 0 }
            Start-Sleep -Seconds 30
          }
          throw "TUI $version did not appear on npm within 15 minutes"

      - name: Assemble offline payload
        env:
          # workflow_dispatch input; kept in env so it is never inlined into the shell.
          KERNEL_VERSION_INPUT: ${{ inputs.kernel_version }}
        run: |
          if ($env:KERNEL_VERSION_INPUT) {
            node scripts/windows/build-installer-payload.mjs --out dist-windows --kernel-version $env:KERNEL_VERSION_INPUT
          } else {
            node scripts/windows/build-installer-payload.mjs --out dist-windows
          }

      - name: Install NSIS compiler
        run: choco install nsis --version=3.11 --yes --no-progress

      - name: Verify payload and isolated EXE lifecycle
        env:
          # The isolated EXE installs with --file-only and never spawns PowerShell.
          # Opt in to the real HKCU PATH round-trip on this disposable runner so
          # the registry half of the installer is covered before it ships.
          DSH_INSTALLER_SYSTEM_TESTS: '1'
        run: node scripts/verify-windows-installer.mjs --build dist-windows --makensis 'C:\Program Files (x86)\NSIS\makensis.exe'

      - name: Compile release installer
        run: |
          & 'C:\Program Files (x86)\NSIS\makensis.exe' /V2 "/DBUILD_DIR=$pwd\dist-windows" scripts/windows/installer.nsi
          if ($LASTEXITCODE -ne 0) { throw 'NSIS compilation failed' }

      - name: Verify release executable and checksum
        run: node scripts/verify-windows-installer.mjs --exe dist-windows/dsh-tui-setup-win-x64.exe

      - uses: actions/upload-artifact@v4
        with:
          name: windows-release-assets
          path: dist-windows/dsh-tui-setup-win-x64.exe
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: windows-build-evidence
          path: |
            dist-windows/locks/*.json
            dist-windows/metadata.json
            dist-windows/downloads/SHASUMS256.txt
            dist-windows/smoke-result.json

