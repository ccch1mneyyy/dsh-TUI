<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>dsh-TUI | Interactive preview</title>
    <link rel="icon" href="/logo.svg" type="image/svg+xml">
    <link rel="stylesheet" href="/xterm.css">
    <link rel="stylesheet" href="/style.css">
    <script src="/xterm.js" defer></script>
    <script src="/fit.js" defer></script>
    <script src="/icons.js" defer></script>
    <script type="module" src="/app.mjs"></script>
  </head>
  <body>
    <header>
      <strong>dsh-TUI</strong>
      <span class="badge">DEMO</span>
      <output id="status" role="status">Connecting</output>
      <nav aria-label="Preview controls">
        <button id="run" title="Run demo conversation" aria-label="Run demo conversation" disabled><i data-lucide="play"></i></button>
        <button id="theme" title="Choose terminal theme" aria-label="Choose terminal theme" disabled><i data-lucide="palette"></i></button>
        <button id="help" title="Open TUI help" aria-label="Open TUI help" disabled><i data-lucide="circle-help"></i></button>
        <button id="reset" title="Reset demo session" aria-label="Reset demo session"><i data-lucide="rotate-ccw"></i></button>
        <button id="fullscreen" title="Toggle fullscreen" aria-label="Toggle fullscreen"><i data-lucide="maximize"></i></button>
      </nav>
    </header>
    <main id="terminal" aria-label="Live dsh-TUI terminal"></main>
    <section id="error-panel" role="alert" hidden><pre id="error"></pre></section>
    <footer><span>Real TUI renderer</span><span>Scripted responses · No API key · No shell</span><output id="size"></output></footer>
  </body>
</html>
