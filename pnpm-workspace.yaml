  - 'vendor/mathjax-tex-svg'

# Dev-tree resolution pin: pnpm's prerelease range resolution prefers the
# registry `latest` dist-tag (0.1.0-rc.6 for most @deepseek-ai/dsh-* even
# after the 0.1.1 release; the 0.1.1 line rides the `next` tag), so the
# wide peer/dev range ending in `|| 0.2.1-rc.5` would install an rc.6
# mix instead of a coherent fixture tree. Overrides force the whole
# @deepseek-ai tree to the 0.2.1-rc.5 line locally (the primary
# validated line; see src/dsh-adapter/contract.ts). Published
# peerDependencies stay wide, and this file is never consulted by consumer
# installs.
overrides:
  '@deepseek-ai/cordis': 4.0.5
  '@deepseek-ai/schemastery': 3.18.5
  '@deepseek-ai/cordis-plugin-loader': 1.0.6
  '@deepseek-ai/cordis-plugin-include': 1.0.10
  '@deepseek-ai/cordis-plugin-group': 1.0.5
  '@deepseek-ai/cordis-plugin-timer': 1.1.7
  '@deepseek-ai/cosmokit': 1.8.6
  # The host-only packages the entry takes types from
  # (src/dsh-adapter/host-contract.ts). At run time the entry loads the
  # installed dsh's own copies by realpath.
  '@deepseek-ai/dsh-app-boot': 0.2.1-rc.5
  '@deepseek-ai/dsh-cmdline': 0.2.1-rc.5
  '@deepseek-ai/dsh-http-proxy': 0.2.1-rc.5
  '@deepseek-ai/dsh-launch-environment': 0.2.1-rc.5
  '@deepseek-ai/dsh-agent': 0.2.1-rc.5
  '@deepseek-ai/dsh-agent-instructions': 0.2.1-rc.5
  '@deepseek-ai/dsh-agent-preset-registry': 0.2.1-rc.5
  '@deepseek-ai/dsh-atomic-write': 0.2.1-rc.5
  '@deepseek-ai/dsh-attachment': 0.2.1-rc.5
  '@deepseek-ai/dsh-brand': 0.2.1-rc.5
  # Browser-half optional peers of dsh-working-activity; pnpm auto-installs
  # them, so pin them to the same line to keep the dev tree single-version.
  '@deepseek-ai/dsh-client-ui-conversation': 0.2.1-rc.5
  '@deepseek-ai/dsh-client-ui-renderer': 0.2.1-rc.5
  '@deepseek-ai/dsh-client-ui-session': 0.2.1-rc.5
  '@deepseek-ai/dsh-ptc-runtime': 0.2.1-rc.5
  '@deepseek-ai/dsh-ptc-runtime-node': 0.2.1-rc.5
  '@deepseek-ai/dsh-commands': 0.2.1-rc.5
  '@deepseek-ai/dsh-command-compact': 0.2.1-rc.5
  '@deepseek-ai/dsh-compaction-basic': 0.2.1-rc.5
  '@deepseek-ai/dsh-compaction-tool-result-pruner': 0.2.1-rc.5
  '@deepseek-ai/dsh-cordis-host-runner': 0.2.1-rc.5
  '@deepseek-ai/dsh-deepseek-account': 0.2.1-rc.5
  '@deepseek-ai/dsh-fs': 0.2.1-rc.5
  '@deepseek-ai/dsh-fs-local': 0.2.1-rc.5
  '@deepseek-ai/dsh-home-paths': 0.2.1-rc.5
  '@deepseek-ai/dsh-host-webserver': 0.2.1-rc.5
  '@deepseek-ai/dsh-llm': 0.2.1-rc.5
  '@deepseek-ai/dsh-llm-pi-ai': 0.2.1-rc.5
  '@deepseek-ai/dsh-persona': 0.2.1-rc.5
  '@deepseek-ai/dsh-plugin-manager': 0.2.1-rc.5
  '@deepseek-ai/dsh-plan-mode': 0.2.1-rc.5
  '@deepseek-ai/dsh-sandbox': 0.2.1-rc.5
  '@deepseek-ai/dsh-sandbox-policy': 0.2.1-rc.5
  '@deepseek-ai/dsh-scope': 0.2.1-rc.5
  '@deepseek-ai/dsh-session': 0.2.1-rc.5
  '@deepseek-ai/dsh-session-persistence': 0.2.1-rc.5
  '@deepseek-ai/dsh-session-persistence-jsonl': 0.2.1-rc.5
  # Upstream dropped the sqlite backend at 0.1.2-alpha.3; rc.2 stays as a
  # dev-only exact pin because scripts/migrate-sessions-to-jsonl.mts still
  # reads the retired cc-tui SQLite store through it. Never a peer.
  #
  # It lives behind the vendor/sqlite-island wrapper package: 0.1.5 removed
  # exports the rc.2 build links against (DEFAULT_PREPARED_SESSION_CACHE_SIZE,
  # PersistenceCoordinator, …), and the blanket overrides above would force
  # the incompatible 0.1.5 copies into its peer slots — pnpm resolves a
  # root-level dependency's peers from the ROOT context, so an override
  # selector on the sqlite package itself cannot reach them. Inside the
  # wrapper's subtree the peers resolve from the wrapper's own dependency
  # list, and these selector overrides pin that closure at 0.1.1-rc.2
  # (persistence → session → llm → brand/timeout/scope/typert-protocol/
  # attachment/invariants, all peer-only packages) without touching the
  # primary 0.1.5 tree.
  '@dsh-tui-dev/sqlite-island>@deepseek-ai/dsh-session-persistence-sqlite': 0.1.1-rc.2
  '@dsh-tui-dev/sqlite-island>@deepseek-ai/dsh-session-persistence': 0.1.1-rc.2
  '@dsh-tui-dev/sqlite-island>@deepseek-ai/dsh-session': 0.1.1-rc.2
  '@dsh-tui-dev/sqlite-island>@deepseek-ai/dsh-llm': 0.1.1-rc.2
  '@dsh-tui-dev/sqlite-island>@deepseek-ai/dsh-invariants': 0.1.1-rc.2
  '@dsh-tui-dev/sqlite-island>@deepseek-ai/dsh-brand': 0.1.1-rc.2
  '@dsh-tui-dev/sqlite-island>@deepseek-ai/dsh-timeout': 0.1.1-rc.2
  '@dsh-tui-dev/sqlite-island>@deepseek-ai/dsh-scope': 0.1.1-rc.2
  '@dsh-tui-dev/sqlite-island>@deepseek-ai/dsh-typert-protocol': 0.1.1-rc.2
  '@dsh-tui-dev/sqlite-island>@deepseek-ai/dsh-attachment': 0.1.1-rc.2
  '@deepseek-ai/dsh-skill-filesystem': 0.2.1-rc.5
  '@deepseek-ai/dsh-settings': 0.2.1-rc.5
  '@deepseek-ai/dsh-skill': 0.2.1-rc.5
  '@deepseek-ai/dsh-storage': 0.2.1-rc.5
  '@deepseek-ai/dsh-storage-domain': 0.2.1-rc.5
  '@deepseek-ai/dsh-storage-json': 0.2.1-rc.5
  '@deepseek-ai/dsh-subprocess': 0.2.1-rc.5
  '@deepseek-ai/dsh-system-prompt': 0.2.1-rc.5
  '@deepseek-ai/dsh-terminal': 0.2.1-rc.5
  '@deepseek-ai/dsh-terminal-bash': 0.2.1-rc.5
  '@deepseek-ai/dsh-timeout': 0.2.1-rc.5
  '@deepseek-ai/dsh-tool-ask-user': 0.2.1-rc.5
  '@deepseek-ai/dsh-tool-fs': 0.2.1-rc.5
  '@deepseek-ai/dsh-tool-fs-search': 0.2.1-rc.5
  '@deepseek-ai/dsh-tool-goal': 0.2.1-rc.5
  '@deepseek-ai/dsh-tool-jobs': 0.2.1-rc.5
  '@deepseek-ai/dsh-tool-ralph': 0.2.1-rc.5
  '@deepseek-ai/dsh-tool-str-replace-editor': 0.2.1-rc.5
  '@deepseek-ai/dsh-tool-subagent-control': 0.2.1-rc.5
  '@deepseek-ai/dsh-tool-todo': 0.2.1-rc.5
  '@deepseek-ai/dsh-tool-web': 0.2.1-rc.5
  '@deepseek-ai/dsh-tool-workflow': 0.2.1-rc.5
  '@deepseek-ai/dsh-workflow-ptc': 0.2.1-rc.5
  '@deepseek-ai/dsh-tool-bash-persistent': 0.2.1-rc.5
  '@deepseek-ai/dsh-tool-cordis': 0.2.1-rc.5
  '@deepseek-ai/dsh-tool-subagent': 0.2.1-rc.5
  '@deepseek-ai/dsh-tools': 0.2.1-rc.5
  '@deepseek-ai/dsh-typert-protocol': 0.2.1-rc.5
  '@deepseek-ai/dsh-user-approval': 0.2.1-rc.5
  '@deepseek-ai/dsh-user-questions': 0.2.1-rc.5
