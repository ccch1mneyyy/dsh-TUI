allowBuilds:
  # Optional postinstall-only (pi-ai transitive deps): nothing at runtime
  # needs their build scripts.
  '@google/genai': false
  esbuild: false
  koffi: false
  protobufjs: false
# Keep the 24-hour delay; exemptions track only the current lockfile cohort.
