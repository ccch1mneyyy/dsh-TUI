# Dev-tree resolution pin: pnpm's prerelease range resolution prefers the
# registry `latest` dist-tag (0.1.0-rc.6 for most @deepseek-ai/dsh-* even
# after the 0.1.1 release; the 0.1.1 line rides the `next` tag), so the
# wide peer/dev range ending in `|| ^0.1.2-alpha.2` would install an rc.6
# mix instead of the fixed rc.2 fixture tree used for legacy verification.
# Overrides force the whole @deepseek-ai tree to the 0.1.1-rc.2 line
# locally. Published peerDependencies stay wide (verified: rc.6/rc.7/rc.8
# and 0.1.1-rc.1/rc.2 and 0.1.2 prereleases satisfy it), and this file is never
# consulted by consumer installs.
